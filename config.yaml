# ==========================================================
# Machiavelli Geopolitics Bot - 設定ファイル
# ==========================================================

# --- 投稿頻度の調整 ---
# posting_interval_minutes: 何分おきにツイートを試みるか
# posts_per_day_cap:        1日あたりの最大投稿数(過剰投稿の防止)
# quiet_hours:              つぶやかない時間帯(現地時間, 24h表記)
# 【注記 2026-11-09】schedule・mode・twitter_api・persona の各項目は、X(Twitter)へ投稿していた頃の
# 旧入口 bot.py だけが読む。現在のフィード方式(generate_feed.py、GitHub Actions の tweet.yml)は読まない。
# 実行の頻度は .github/workflows/tweet.yml の cron と feed_stock.py(ストック方式)で決まる。
schedule:
  posting_interval_minutes: 180      # 例: 180 = 3時間おき。頻度を上げたければ数値を下げる(最小30推奨)
  posts_per_day_cap: 6
  quiet_hours:
    start: "01:00"
    end: "06:00"
  timezone: "Asia/Tokyo"

# --- 動作モード ---
# dry_run: true の間は実際には投稿せず、logs/tweets.jsonl に出力するだけ。
#          Twitter/X API の認証情報を設定し、false にすると実際に投稿する。
mode:
  dry_run: true

# --- ニュース取得元 (RSS) ---
# 地政学的に重要度の高い一次情報・通信社ソースを中心に設定。
# 自由に追加・削除可能。
#
# 注記(2026年更新): Reuters・AP は一般向けRSS配信を既に終了しているため、
# 代わりに Google News の国際(World)トピックフィードと、BBC / Al Jazeera を
# 追加し、特定ソース(NHK)への偏りを解消した。
news_sources:
  - name: "Google News 国際(World)"
    url: "https://news.google.com/rss/headlines/section/topic/WORLD?hl=ja&gl=JP&ceid=JP:ja"
  - name: "BBC World"
    url: "http://feeds.bbci.co.uk/news/world/rss.xml"
  - name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
  # NHK の RSS は 2026-08-08 を最後に更新が止まっているため外した(2026-11-05。モンテーニュでも同じ)
  # 2026-11-05 追加: 1回の実行で試せる新しい記事が5〜9件しかなく、生成に使える時間を余らせていた。
  # 地域・主題ごとの検索で、地政学の記事を直接集める(when:2d は直近2日)
  - name: "Google News 検索 安全保障"
    url: "https://news.google.com/rss/search?q=%E5%AE%89%E5%85%A8%E4%BF%9D%E9%9A%9C+OR+%E9%98%B2%E8%A1%9B+OR+%E6%8A%91%E6%AD%A2+OR+%E8%87%AA%E8%A1%9B%E9%9A%8A+OR+%E5%9C%A8%E6%97%A5%E7%B1%B3%E8%BB%8D+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 検索 中国・台湾"
    url: "https://news.google.com/rss/search?q=%E5%8F%B0%E6%B9%BE%E6%B5%B7%E5%B3%A1+OR+%E5%B0%96%E9%96%A3+OR+%E5%8D%97%E3%82%B7%E3%83%8A%E6%B5%B7+OR+%E4%B8%AD%E5%9B%BD%E8%BB%8D+OR+%E4%B8%AD%E5%9B%BD%E6%B5%B7%E8%AD%A6+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 検索 朝鮮半島"
    url: "https://news.google.com/rss/search?q=%E5%8C%97%E6%9C%9D%E9%AE%AE+%E3%83%9F%E3%82%B5%E3%82%A4%E3%83%AB+OR+%E5%8C%97%E6%9C%9D%E9%AE%AE+%E6%A0%B8+OR+%E9%87%91%E6%AD%A3%E6%81%A9+OR+%E9%9F%93%E5%9B%BD%E8%BB%8D+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 検索 ロシア・ウクライナ"
    url: "https://news.google.com/rss/search?q=%E3%83%AD%E3%82%B7%E3%82%A2+%E3%82%A6%E3%82%AF%E3%83%A9%E3%82%A4%E3%83%8A+%E6%94%BB%E6%92%83+OR+%E5%81%9C%E6%88%A6+OR+%E5%92%8C%E5%B9%B3%E4%BA%A4%E6%B8%89+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 検索 中東"
    url: "https://news.google.com/rss/search?q=%E3%82%A4%E3%83%A9%E3%83%B3+OR+%E3%82%A4%E3%82%B9%E3%83%A9%E3%82%A8%E3%83%AB+OR+%E3%82%AC%E3%82%B6+OR+%E3%83%9B%E3%83%AB%E3%83%A0%E3%82%BA+OR+%E4%B8%AD%E6%9D%B1%E6%83%85%E5%8B%A2+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 検索 米国の外交"
    url: "https://news.google.com/rss/search?q=%E3%83%88%E3%83%A9%E3%83%B3%E3%83%97+%E5%A4%96%E4%BA%A4+OR+%E9%96%A2%E7%A8%8E+OR+%E5%88%B6%E8%A3%81+OR+%E9%A6%96%E8%84%B3%E4%BC%9A%E8%AB%87+OR+%E5%9B%BD%E5%8B%99%E9%95%B7%E5%AE%98+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  # 国内政治は少量だけ加える(モンテーニュ・ベーコンでは除外している領分。limit は1回に読む件数の上限)
  - name: "Google News 検索 国内政治"
    url: "https://news.google.com/rss/search?q=%E9%A6%96%E7%9B%B8+OR+%E5%86%85%E9%96%A3+OR+%E9%80%A3%E7%AB%8B+OR+%E8%A1%86%E9%99%A2%E8%A7%A3%E6%95%A3+OR+%E6%86%B2%E6%B3%95%E6%94%B9%E6%AD%A3+OR+%E9%98%B2%E8%A1%9B%E8%B2%BB+OR+%E6%94%BF%E6%A8%A9%E9%81%8B%E5%96%B6+when:2d&hl=ja&gl=JP&ceid=JP:ja"
    limit: 10
  - name: "防衛省ニュース"
    url: "https://www.mod.go.jp/rss/news.xml"
  - name: "外務省報道発表"
    url: "https://www.mofa.go.jp/rss/press.xml"

# --- 地政学的重要度スコアリングの重み ---
# geopolitical_scorer.py が使用するキーワード群。重要ニュースの選別基準。
#
# 設計方針(2026年改訂):
# ・「訪問」「会談」「声明」のような、スポーツ・芸能等の記事にも
#   偶然マッチしてしまう汎用的すぎる語は low 階層から削除した
#   (例:「メジャーリーグ球団がホワイトハウスを訪問」が「訪問」に
#   反応して選ばれてしまう事例があったため)。
# ・exclude に該当する語が含まれる記事は、他の一致に関わらず
#   無条件で除外する(スポーツ・芸能・エンタメ等のノイズ排除)。
# ・selection.minimum_score 未満のスコアの記事は選ばない
#   (弱い一致1つだけでは選出されないようにする)。
scoring_weights:
  high:      # 重み 4点: 軍事的実力・主権・勢力均衡に直結
    - "軍事"
    - "侵攻"
    - "領土"
    - "核"
    - "同盟"
    - "米軍"
    - "台湾有事"
    - "戦争"
    - "封鎖"
    - "抑止"
    - "military"
    - "invasion"
    - "sovereignty"
    - "nuclear"
    - "alliance"
    # 2026-11-05 追加: 「ロシア、ウクライナのエネ施設に大規模攻撃」「北朝鮮が弾道ミサイル発射」
    # 「中国海警局の船、尖閣周辺の領海に侵入」がいずれも0点で、候補から外れていた
    - "攻撃"
    - "空爆"
    - "ミサイル"
    - "停戦"
    - "領海"
    - "主権"
    - "自衛隊"
    - "防衛"
    - "安全保障"
    - "台湾"
    - "尖閣"
    - "併合"
    - "クーデター"
  medium:    # 重み 2点: 勢力圏・経済安全保障・外交
    - "外交"
    - "制裁"
    - "関税"
    - "首脳会談"
    - "国連"
    # 2026-11-09: "safety"(2回重複していた)を "security" に直した。safety は製品の安全性など
    # 地政学と無関係の英語記事にも点を付けていた
    - "security"
    - "sanction"
    - "summit"
    # 2026-11-05 追加(主要な当事国・外交と国内政治の語)
    - "中国"
    - "ロシア"
    - "ウクライナ"
    - "北朝鮮"
    - "イラン"
    - "イスラエル"
    - "ガザ"
    - "中東"
    - "NATO"
    - "交渉"
    - "仲介"
    - "外相"
    - "国防"
    - "覇権"
    - "経済安全保障"
    - "レアアース"
    - "首相"
    - "政権"
    - "連立"
    - "解散"
    - "憲法改正"
  low:       # 重み 1点: 国際情勢がらみだが単独では弱いシグナル
    - "対立"
    - "緊張"
    - "危機"
    - "非難"
    - "警告"
    - "反発"
    - "要求"

# 以下の語が含まれる記事は、他の一致点数に関わらず候補から除外する。
# スポーツ・芸能・エンタメ・グルメ等、地政学分析の素材にふさわしくない記事のノイズ除去。
exclude_keywords:
  - "地方協力本部"   # 自衛隊の採用説明会の告知(ニュースではない)
  - "採用説明会"
  - "メジャーリーグ"
  - "MLB"
  - "プロ野球"
  - "野球"
  - "サッカー"
  - "Jリーグ"
  - "バスケットボール"
  - "NBA"
  - "オリンピック"
  - "全豪オープン"
  - "全米オープン"
  - "ワールドカップ"
  - "芸能"
  - "俳優"
  - "女優"
  - "アイドル"
  - "コンサート"
  - "ライブツアー"
  - "映画"
  - "ドラマ"
  - "アニメ"
  - "ゲーム実況"
  - "グルメ"
  - "レシピ"
  - "ファッション"
  - "占い"
  - "ホワイトハウスを訪問"    # スポーツ球団等の表敬訪問(外交行事ではない)を明示的に除外

# --- 選別の閾値 ---
selection:
  # このスコア未満の記事は、たとえ最上位でも選ばない。
  # (low階層のキーワード単独一致=1点では選出されない水準に設定)
  # 2026-11-04 に3から2へ下げた。ストック方式(1回の起動で1日分を作る)では、3点以上の新しい記事が
  # 1回に4件ほどしか無かった。題材の質は、箴言の採点(3点のみ合格)と導入文の検査で確かめる。
  # 2026-11-05: 重みの語を大きく増やした(攻撃・ミサイル・中国・ロシアなどが0点だった)のに合わせて3にした。
  # 2のままだと「中国でパンダの赤ちゃん誕生」(中国=2点)も候補になる。高い階層の語1つ(4点)、
  # または当事国と緊張の語(2+1点)があれば選ばれる
  minimum_score: 3

# --- Twitter/X API 認証情報 (dry_run=false の場合のみ使用) ---
# ここには直接キーを書かず、環境変数から読み込む運用を強く推奨します。
twitter_api:
  api_key_env: "TWITTER_API_KEY"
  api_secret_env: "TWITTER_API_SECRET"
  access_token_env: "TWITTER_ACCESS_TOKEN"
  access_secret_env: "TWITTER_ACCESS_SECRET"

# --- ツイート文体の設定 ---
persona:
  tone: "cold_realist"   # マキャベリの冷徹な現実主義トーン固定
  max_chars: 280
  language: "ja"
  # 近現代のリベラルな規範(国際法の理想主義・主権平等の建前)を採用せず、
  # 力の実相・保護国/属国関係・恐怖と信義の道具性を軸に分析するモード。
  ignore_liberal_framing: true
