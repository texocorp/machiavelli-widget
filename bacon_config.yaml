    - "論文不正"
    - "研究不正"
    - "疑似科学"
    - "生成AI"
    - "AI"
    - "人工知能"
    - "半導体"
    - "量子"
    - "研究費"
    - "科学技術"
    - "学術会議"
    - "研究者"
    - "論文"
    - "発見"
  medium:    # 重み 2点
    - "SNS"
    - "報道"
    - "メディア"
    - "投稿"
    - "噂"
    - "予言"
    - "占い"
    - "迷信"
    - "専門家"
    - "有識者"
    - "研究"
