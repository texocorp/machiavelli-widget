  - "おすすめ"
  - "iPhone"
  - "スマホケース"
  # --- 人の死を扱う記事(モンテーニュと同じ方針。引用を添えると、亡くなった人や遺族への論評に読める) ---
  # 実例(2026-11-04): 試合中の事故で選手が亡くなった記事に、政治と世論についての引用を添えて掲載した
  - "死去"
  - "死亡"
  - "訃報"
  - "死者"
  - "亡くな"
  - "遺体"
  - "遺族"
  - "試合中"
  # --- 解説・入門の記事(誰かが何かに引きずられている「出来事」がなく、論評の素材にならない) ---
  # 実例: 「次世代のAI『AIエージェント』とは－従来の生成AIとの違いを分かりやすく解説」
  - "とは－"
  - "とは-"
  - "とは？"
  - "とは?"
  - "分かりやすく"
  - "わかりやすく"
  - "徹底解説"
  - "入門"
  - "使い方"
  - "基礎知識"
  # (2026-11-09: 海外の転載・機械翻訳サイトは feed_stock.SUSPICIOUS_SOURCES に一本化し、3ボット共通で見送る)
  # --- 引用を添えること自体が無神経になりうる記事 ---
  - "自殺"
  - "自死"
  - "心中"
  - "飛び降り"
  - "性的暴行"
  - "性暴力"
  - "わいせつ"
  - "盗撮"
  - "児童ポルノ"
  # --- マキャベリ側の領分(国際情勢・軍事・政局) ---
  # 「首相」「内閣」は除外しない(政府のAI・研究政策はこのボットの題材)。
  # 他のボットがすでに論評した記事は generate_bacon_feed.py が別途避ける。
  - "衆院"
  - "参院"
  - "総裁選"
  - "自民党"
  - "立憲民主"
  - "日銀"
  - "株価"
  - "為替"
  - "外相"
  - "外務省"
  - "防衛省"
  - "自衛隊"
  - "米軍"
  - "ミサイル"
  - "大統領"
  - "関税"
  - "制裁"
  # --- モンテーニュ側の領分(医療・介護) ---
  # 「地震」「逮捕」は除外しない(「地震予言の拡散」「偽情報の投稿者を逮捕」はこのボットの題材)。
  - "病院"
  - "患者"
  - "治療"
  - "介護"
  - "震度1"
  - "震度2"
  - "震度3"

# --- 選別の閾値 ---
selection:
  # high 階層の語が1つ当たる(4点)か、medium 2つ以上で選出される水準
  minimum_score: 4

# --- 言説の語(必須条件) ---
# 視座が「イドラの摘発」なので、誰かが何かを思い込み、言い立て、受け止めている場面のない記事
# (研究機関の発表・連携協定・新製品の紹介など)は論評の素材にならない。
# 実例: 「ゲリラ雷雨予測技術開発事業に関する連携協力協定を締結」に、見出しにない
# 「実用性という呼び名」をモデルが付け足し、引用とも噛み合わなかった。
# そこで、以下の語を一つも含まない記事は、点数に関わらず候補から外す。
discourse_keywords:
  - "論争"
  - "議論"
  - "批判"
  - "反発"
  - "反対"
  - "抗議"
