# ==========================================================
# Bacon Idols Bot - 設定ファイル
# ==========================================================
# マキャベリボット(config.yaml)・モンテーニュボット(montaigne_config.yaml)とは独立した設定。
# 題材は「世論・メディア・言説」と「科学技術・AI・研究政策」。
# 視座は「イドラの摘発」: ニュースそのもの、またそれをめぐる報道・世論・専門家の
# 言説に潜む四つのイドラ(種族・洞窟・市場・劇場)を冷徹に剥がす。
# 国際情勢・国内政局はマキャベリ側、日本の社会面・医療はモンテーニュ側の領分。

# --- ニュース取得元 (RSS) ---
# 自由に追加・削除可能。取得に失敗したフィードは飛ばして続行する。
# 検索フィードの「when:2d」は直近2日の記事に限る指定。
news_sources:
  - name: "Google News 科学"
    url: "https://news.google.com/rss/headlines/section/topic/SCIENCE?hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News テクノロジー"
    url: "https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=ja&gl=JP&ceid=JP:ja"
  - name: "NHK科学・医療"
    url: "https://www3.nhk.or.jp/rss/news/cat3.xml"
  - name: "Google News 偽情報・言説"
    url: "https://news.google.com/rss/search?q=%E5%81%BD%E6%83%85%E5%A0%B1+OR+%E8%AA%A4%E6%83%85%E5%A0%B1+OR+%E3%83%87%E3%83%9E+OR+%E9%99%B0%E8%AC%80%E8%AB%96+OR+%E3%83%95%E3%82%A1%E3%82%AF%E3%83%88%E3%83%81%E3%82%A7%E3%83%83%E3%82%AF+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News SNS・報道"
    url: "https://news.google.com/rss/search?q=SNS+%E7%82%8E%E4%B8%8A+OR+%E8%AA%B9%E8%AC%97%E4%B8%AD%E5%82%B7+OR+%E5%A0%B1%E9%81%93+OR+%E4%B8%96%E8%AB%96%E8%AA%BF%E6%9F%BB+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News AI・研究政策"
    url: "https://news.google.com/rss/search?q=%E7%94%9F%E6%88%90AI+OR+%E7%A0%94%E7%A9%B6%E8%B2%BB+OR+%E7%A7%91%E5%AD%A6%E6%8A%80%E8%A1%93+OR+%E5%AD%A6%E8%A1%93%E4%BC%9A%E8%AD%B0+OR+%E8%AB%96%E6%96%87%E4%B8%8D%E6%AD%A3+when:2d&hl=ja&gl=JP&ceid=JP:ja"

# --- 重要度スコアリングの重み ---
# ベーコンが論じるのは、人間の知性がいかに欺かれるか、そして知がいかに力となるか。
# 言葉と世論が人を惑わす出来事と、技術・研究が社会の力関係を変える出来事を重く見る。
scoring_weights:
  high:      # 重み 4点
    - "偽情報"
    - "誤情報"
    - "フェイク"
    - "ディープフェイク"
    - "デマ"
    - "陰謀論"
    - "ファクトチェック"
    - "世論調査"
    - "世論"
    - "炎上"
    - "誹謗中傷"
    - "拡散"
    - "風評"
    - "捏造"
    - "ねつ造"
    - "改ざん"
    - "論文不正"
    - "研究不正"
    - "疑似科学"
    - "生成AI"
    - "AI"
    - "人工知能"
    - "半導体"
    - "量子"
    - "研究費"
    - "科学技術"
    - "学術会議"
    - "研究者"
    - "論文"
    - "発見"
  medium:    # 重み 2点
    - "SNS"
    - "報道"
    - "メディア"
    - "投稿"
    - "噂"
    - "予言"
    - "占い"
    - "迷信"
    - "専門家"
    - "有識者"
    - "研究"
    - "大学"
    - "実験"
    - "検証"
    - "データ"
    - "宇宙"
    - "ロケット"
    - "ロボット"
    - "核融合"
    - "原発"
    - "遺伝子"
    - "ゲノム"
    - "自動運転"
    - "開発"
    - "実用化"
    - "規制"
    - "著作権"
    - "教育"
  low:       # 重み 1点
    - "調査"
    - "議論"
    - "波紋"
    - "批判"
    - "初めて"
    - "世界初"
    - "新た"
    - "懸念"
    - "発表"

# 以下の語が含まれる記事は、他の一致点数に関わらず候補から除外する。
exclude_keywords:
  # --- スポーツ・芸能・商品紹介など(他のボットと同じ方針) ---
  - "メジャーリーグ"
  - "MLB"
  - "プロ野球"
  - "高校野球"
  - "甲子園"
  - "サッカー"
  - "Jリーグ"
  - "バスケットボール"
  - "Bリーグ"
  - "大相撲"
  - "オリンピック"
  - "パラリンピック"
  - "ワールドカップ"
  - "芸能"
  - "俳優"
  - "女優"
  - "アイドル"
  - "コンサート"
  - "映画"
  - "ドラマ"
  - "アニメ"
  - "ゲーム機"
  - "グルメ"
  - "レシピ"
  - "ファッション"
  - "占い師"
  - "天気予報"
  - "セール"
  - "値下げ"
  - "最安"
  - "クーポン"
  - "レビュー"
  - "おすすめ"
  - "iPhone"
  - "スマホケース"
  # --- 解説・入門の記事(誰かが何かに引きずられている「出来事」がなく、論評の素材にならない) ---
  # 実例: 「次世代のAI『AIエージェント』とは－従来の生成AIとの違いを分かりやすく解説」
  - "とは－"
  - "とは-"
  - "とは？"
  - "とは?"
  - "分かりやすく"
  - "わかりやすく"
  - "徹底解説"
  - "入門"
  - "使い方"
  - "基礎知識"
  # --- 引用を添えること自体が無神経になりうる記事 ---
  - "自殺"
  - "自死"
  - "心中"
  - "飛び降り"
  - "性的暴行"
  - "性暴力"
  - "わいせつ"
  - "盗撮"
  - "児童ポルノ"
  # --- マキャベリ側の領分(国際情勢・軍事・政局) ---
  # 「首相」「内閣」は除外しない(政府のAI・研究政策はこのボットの題材)。
  # 他のボットがすでに論評した記事は generate_bacon_feed.py が別途避ける。
  - "衆院"
  - "参院"
  - "総裁選"
  - "自民党"
  - "立憲民主"
  - "日銀"
  - "株価"
  - "為替"
  - "外相"
  - "外務省"
  - "防衛省"
  - "自衛隊"
  - "米軍"
  - "ミサイル"
  - "大統領"
  - "関税"
  - "制裁"
  # --- モンテーニュ側の領分(医療・介護) ---
  # 「地震」「逮捕」は除外しない(「地震予言の拡散」「偽情報の投稿者を逮捕」はこのボットの題材)。
  - "病院"
  - "患者"
  - "治療"
  - "介護"
  - "震度1"
  - "震度2"
  - "震度3"

# --- 選別の閾値 ---
selection:
  # high 階層の語が1つ当たる(4点)か、medium 2つ以上で選出される水準
  minimum_score: 4

# --- 文体 ---
persona:
  tone: "idola"         # イドラの摘発。断罪や政策提言ではなく、知性の欺かれ方を冷徹に指摘する
  language: "ja"
