# --- 優先する配信元 ---
# 言説の現場を直接拾う検索フィードの記事に加点する(科学・テクノロジーの一般フィードより先に選ばれる)。
priority_sources:
  bonus: 4
  names:
    - "Google News 偽情報・言説"
    - "Google News SNS・報道"
    - "Google News 情報操作・偽動画"
    - "Google News 風評・噂"

# --- 文体 ---
persona:
  tone: "idola"         # イドラの摘発。断罪や政策提言ではなく、知性の欺かれ方を冷徹に指摘する
  language: "ja"
