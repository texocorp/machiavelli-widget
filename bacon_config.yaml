# --- 重要度スコアリングの重み ---
# ベーコンが論じるのは、人間の知性がいかに欺かれるか、そして知がいかに力となるか。
# 言葉と世論が人を惑わす出来事と、技術・研究が社会の力関係を変える出来事を重く見る。
scoring_weights:
  high:      # 重み 4点
    - "思い込み"   # 2026-11-06 追加: 通念の誤りを名指す語は、それだけで素材になる
    - "定説"
    - "通説"
    - "俗説"
    # 「偏見」は 2026-11-09 に外した: 「乾癬の患者が偏見と差別に声を上げる」のような、人の境遇の記事まで
    # ベーコンの領分になった(優先順位でモンテーニュから奪う)。言説の語(必須条件)には残すので、
    # 「偏見を生む報道・言説」の記事は、他の語の点数で引き続き拾える
    - "先入観"
    - "錯覚"
    - "認知戦"
    - "情報戦"
    - "印象操作"
    - "偏向"
    - "偽情報"
    - "誤情報"
    - "フェイク"
    - "ディープフェイク"
