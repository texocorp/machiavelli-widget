    - "発表"

# 以下の語が含まれる記事は、他の一致点数に関わらず候補から除外する。
exclude_keywords:
  - "autosport"    # モータースポーツ(実例: 「前年までの印象を覆す好走」)
  - "PR TIMES"     # 企業の宣伝(実例: 「自動発注の常識を覆す『AI需要予測』実証実験開始」)
  - "セミナー"     # 企業の催しの告知(実例: 生成AI規制の無料セミナー)
  - "相場展望"     # 株式の相場解説
  # --- スポーツ・芸能・商品紹介など(他のボットと同じ方針) ---
  - "メジャーリーグ"
  - "MLB"
  - "プロ野球"
  - "高校野球"
  - "甲子園"
  - "サッカー"
  - "Jリーグ"
  - "バスケットボール"
  - "Bリーグ"
  - "大相撲"
  - "オリンピック"
  - "パラリンピック"
  - "ワールドカップ"
  - "芸能"
  - "俳優"
  - "女優"
  - "アイドル"
  - "コンサート"
  - "映画"
  - "ドラマ"
  - "アニメ"
  - "ゲーム機"
  - "グルメ"
  - "レシピ"
