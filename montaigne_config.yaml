  - name: "Google News 検索 世相"
    url: "https://news.google.com/rss/search?q=%E8%AC%9D%E7%BD%AA%E4%BC%9A%E8%A6%8B+OR+%E5%89%8D%E8%A8%80%E6%92%A4%E5%9B%9E+OR+%E4%B8%80%E8%BB%A2+OR+%E8%BB%A2%E5%A3%B2+OR+%E8%A1%8C%E5%88%97+OR+%E8%B2%B7%E3%81%84%E5%8D%A0%E3%82%81+OR+%E4%BE%BF%E4%B9%97%E5%80%A4%E4%B8%8A%E3%81%92+OR+%E8%AA%87%E5%A4%A7%E5%BA%83%E5%91%8A+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 検索 医療"
    url: "https://news.google.com/rss/search?q=%E9%81%8E%E5%89%B0%E8%A8%BA%E7%99%82+OR+%E8%AA%A4%E8%A8%BA+OR+%E3%83%97%E3%83%A9%E3%82%BB%E3%83%9C+OR+%E5%8C%BB%E7%99%82%E3%83%93%E3%82%B8%E3%83%8D%E3%82%B9+OR+%E5%81%A5%E5%BA%B7%E6%B3%95+OR+%E6%B0%91%E9%96%93%E7%99%82%E6%B3%95+when:2d&hl=ja&gl=JP&ceid=JP:ja"

# --- 重要度スコアリングの重み ---
# モンテーニュは「人間の性が露わになる出来事」を好んで論じる。
# 死・裁き・教育・医療・技術・慣習・他者との摩擦など、
# 人間とは何かを考えさせる出来事を重く見る。
scoring_weights:
  high:      # 重み 4点
    - "判決"
    - "裁判"
    - "冤罪"
    - "再審"
    - "死刑"
    - "虐待"
    - "いじめ"
    - "教育"
    - "学校"
    - "医療"
    - "病院"
    - "感染"
    - "ワクチン"
    - "研究"
    - "発見"
    - "AI"
    - "人工知能"
    - "高齢"
    - "孤独"
    - "孤立"
    - "少子化"
    - "差別"
    - "外国人"
    - "詐欺"
    # 「偽情報」「デマ」は 2026-11-09 に外した: 優先順位(マキャベリ > ベーコン > モンテーニュ)で、
    # これらの語を含む記事は事実上すべてベーコンの領分になり、ここでは点を付けても使われない
    - "災害"
    - "地震"
    - "伝統"
    - "終活"
    - "延命"
    - "安楽死"
    - "尊厳死"
    - "看取り"
    - "クマ"
  medium:    # 重み 2点
    - "逮捕"
    - "容疑"
    - "起訴"
    - "不正"
    - "改ざん"
    - "規制"
    - "法改正"
    - "条例"
    - "校則"
    - "介護"
    - "認知症"
    - "治療"
    - "新薬"
    - "がん"
    - "患者"
    - "宇宙"
    - "動物"
    - "宗教"
    - "祭り"
    - "若者"
    - "家族"
    - "結婚"
    - "働き方"
    - "過労"
    - "事故"
    - "死亡"
    - "SNS"
    - "炎上"
  low:       # 重み 1点
    - "調査"
    - "議論"
    - "波紋"
    - "批判"
    - "増加"
    - "減少"
    - "初めて"
    - "過去最多"
    - "過去最少"

# 以下の語が含まれる記事は、他の一致点数に関わらず候補から除外する。
exclude_keywords:
  # --- スポーツ・芸能など(マキャベリ側と同じ方針) ---
  - "メジャーリーグ"
  - "MLB"
  - "プロ野球"
  - "高校野球"
  - "甲子園"
  - "サッカー"
  - "Jリーグ"
  - "バスケットボール"
  - "Bリーグ"
  - "大相撲"
  - "オリンピック"
  - "パラリンピック"
  - "ワールドカップ"
  - "芸能"
  - "俳優"
  - "女優"
  - "アイドル"
  - "コンサート"
  - "映画"
  - "ドラマ"
  - "アニメ"
  - "グルメ"
  - "レシピ"
  - "ファッション"
  - "占い"
  - "天気予報"
  # --- 箴言を添えること自体が無神経になりうる記事 ---
  # 死を論じる箴言(「死をあらかじめ思うことは自由をあらかじめ思うこと」等)が
  # 自死の報道に添えられる事態を避ける。性犯罪の被害についても同様。
  - "自殺"
  - "自死"
  - "心中"
  - "飛び降り"
  - "性的暴行"
  - "性暴力"
  - "わいせつ"
  - "盗撮"
  - "児童ポルノ"
  # --- 天気・気象の速報(人の振る舞いが書かれておらず、論評の素材にならない) ---
  # 実例(2026-11-03): 「厳しい暑さに 局地的な雨も土砂災害注意」に、見出しに無い
  # 「住民が熱中症対策を続ける様子」を書き足した論評が生成された。
  - "暑さ"
  - "猛暑"
  - "真夏日"
  - "熱中症"
  - "寒さ"
  - "大雨"
  - "大雪"
  - "雷雨"
  - "台風"
  - "気温"
  - "注意報"
  - "警報"
  - "土砂災害"
  - "気象庁"
  # --- 軽微な事故の速報(人の振る舞いを論じる材料に乏しく、テンプレートの空論になりやすい) ---
  - "交通事故"
  - "踏み間違"
  - "衝突"
  - "けが"
  - "負傷"
  - "重傷"
  - "軽傷"
  - "意識不明"
  # --- 死傷者数・訃報の速報 ---
  # 災害・事故・事件で亡くなった人の数や訃報に、死を論じる一節を添えると、
  # 遺族や被災者の目には死者を題材にした気取った文章にしか映らない。
  # 実例(2026-11-03): 地震の死者数の記事に「いたるところで死を待ち受けよう」(I.20)を添えた。
  # 死を論じる一節は、終活・延命治療・高齢化など、死について人が考え議論している記事に向ける。
  - "死者"
  - "犠牲者"
  - "遺体"
  - "死亡が確認"
  - "死亡した"
  - "死亡事故"
  - "亡くなった"
  - "死去"
  - "安否"
  - "行方不明"
  - "身元"
  - "災害関連死"
  - "殺害"
  - "刺殺"
  - "殺人"
  # (2026-11-09: 海外の転載・機械翻訳サイトは feed_stock.SUSPICIOUS_SOURCES に一本化し、3ボット共通で見送る)
  # --- マキャベリ側の領分(国際情勢・国内政治・経済) ---
  - "首相"
  - "内閣"
  - "衆院"
  - "参院"
  - "国会"
  - "総裁選"
  - "自民党"
  - "立憲民主"
  # 2026-11-05 追加: 「維新・藤田氏…民改・小川氏に政策一貫性促す」(党どうしの応酬)を論評した
  - "維新"
  - "国民民主"
  - "公明"
  - "共産党"
  - "れいわ"
  - "参政党"
  - "民改"
  - "比例代表"
  - "議員定数"
  - "日本人ファースト"   # 政党の標語をめぐる応酬(2026-11-05)
  - "選挙ドットコム"     # 選挙・政治の専門媒体
  - "日銀"
  - "株価"
  - "為替"
  - "外相"
  - "外務省"
  - "防衛省"
  - "自衛隊"
  - "米軍"
  - "ミサイル"
  - "大統領"
  - "関税"
  - "制裁"
  # --- 小さな地震の速報(論評の素材にならない) ---
  - "震度1"
  - "震度2"
  - "震度3"

# --- 選別の閾値 ---
selection:
  # high 階層の語が1つ当たる(4点)か、medium 2つ以上で選出される水準
  minimum_score: 4

# --- 文体 ---
persona:
  tone: "observer"      # 人間観察に徹する。善悪の裁断・説教・政策提言をしない
  language: "ja"
