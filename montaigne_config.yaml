# ==========================================================
# Montaigne Society Bot - 設定ファイル
# ==========================================================
# マキャベリボット(config.yaml)とは独立した設定。
# 題材は「日本の社会面」と「科学・医療・技術」。
# 国際情勢・国内政治・経済はマキャベリ側の領分として除外する。

# --- ニュース取得元 (RSS) ---
# 自由に追加・削除可能。取得に失敗したフィードは飛ばして続行する。
news_sources:
  - name: "NHK社会"
    url: "https://www3.nhk.or.jp/rss/news/cat1.xml"
  - name: "NHK科学・医療"
    url: "https://www3.nhk.or.jp/rss/news/cat3.xml"
  - name: "Google News 国内"
    url: "https://news.google.com/rss/headlines/section/topic/NATION?hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 科学"
    url: "https://news.google.com/rss/headlines/section/topic/SCIENCE?hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 健康"
    url: "https://news.google.com/rss/headlines/section/topic/HEALTH?hl=ja&gl=JP&ceid=JP:ja"

# --- 重要度スコアリングの重み ---
# モンテーニュは「人間の性が露わになる出来事」を好んで論じる。
# 死・裁き・教育・医療・技術・慣習・他者との摩擦など、
# 人間とは何かを考えさせる出来事を重く見る。
scoring_weights:
  high:      # 重み 4点
    - "判決"
    - "裁判"
    - "冤罪"
    - "再審"
    - "死刑"
    - "虐待"
    - "いじめ"
    - "教育"
    - "学校"
    - "医療"
    - "病院"
    - "感染"
    - "ワクチン"
    - "研究"
    - "発見"
    - "AI"
    - "人工知能"
    - "高齢"
    - "孤独"
    - "孤立"
    - "少子化"
    - "差別"
    - "外国人"
    - "詐欺"
    - "偽情報"
    - "デマ"
    - "災害"
    - "地震"
    - "伝統"
    - "クマ"
  medium:    # 重み 2点
    - "逮捕"
    - "容疑"
    - "起訴"
    - "不正"
    - "改ざん"
    - "規制"
    - "法改正"
    - "条例"
    - "校則"
    - "介護"
    - "認知症"
    - "治療"
    - "新薬"
    - "がん"
    - "患者"
    - "宇宙"
    - "動物"
    - "宗教"
    - "祭り"
    - "若者"
    - "家族"
    - "結婚"
    - "働き方"
    - "過労"
    - "事故"
    - "死亡"
    - "SNS"
    - "炎上"
  low:       # 重み 1点
    - "調査"
    - "議論"
    - "波紋"
    - "批判"
    - "増加"
    - "減少"
    - "初めて"
    - "過去最多"
    - "過去最少"

# 以下の語が含まれる記事は、他の一致点数に関わらず候補から除外する。
exclude_keywords:
  # --- スポーツ・芸能など(マキャベリ側と同じ方針) ---
  - "メジャーリーグ"
  - "MLB"
  - "プロ野球"
  - "高校野球"
  - "甲子園"
  - "サッカー"
  - "Jリーグ"
  - "バスケットボール"
  - "Bリーグ"
  - "大相撲"
  - "オリンピック"
  - "パラリンピック"
  - "ワールドカップ"
  - "芸能"
  - "俳優"
  - "女優"
  - "アイドル"
  - "コンサート"
  - "映画"
  - "ドラマ"
  - "アニメ"
  - "グルメ"
  - "レシピ"
  - "ファッション"
  - "占い"
  - "天気予報"
  # --- 箴言を添えること自体が無神経になりうる記事 ---
  # 死を論じる箴言(「死をあらかじめ思うことは自由をあらかじめ思うこと」等)が
  # 自死の報道に添えられる事態を避ける。性犯罪の被害についても同様。
  - "自殺"
  - "自死"
  - "心中"
  - "飛び降り"
  - "性的暴行"
  - "性暴力"
  - "わいせつ"
  - "盗撮"
  - "児童ポルノ"
  # --- マキャベリ側の領分(国際情勢・国内政治・経済) ---
  - "首相"
  - "内閣"
  - "衆院"
  - "参院"
  - "国会"
  - "総裁選"
  - "自民党"
  - "立憲民主"
  - "日銀"
  - "株価"
  - "為替"
  - "外相"
  - "外務省"
  - "防衛省"
  - "自衛隊"
  - "米軍"
  - "ミサイル"
  - "大統領"
  - "関税"
  - "制裁"
  # --- 小さな地震の速報(論評の素材にならない) ---
  - "震度1"
  - "震度2"
  - "震度3"

# --- 選別の閾値 ---
selection:
  # high 階層の語が1つ当たる(4点)か、medium 2つ以上で選出される水準
  minimum_score: 4

# --- 文体 ---
persona:
  tone: "observer"      # 人間観察に徹する。善悪の裁断・説教・政策提言をしない
  language: "ja"
