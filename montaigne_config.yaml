  - name: "Google News 検索 偏見・摩擦"
    url: "https://news.google.com/rss/search?q=%E5%81%8F%E8%A6%8B+OR+%E3%83%98%E3%82%A4%E3%83%88+OR+%E5%B7%AE%E5%88%A5%E7%99%BA%E8%A8%80+OR+%E6%8E%92%E5%A4%96+OR+%E6%96%87%E5%8C%96%E6%91%A9%E6%93%A6+OR+%E3%83%9E%E3%83%8A%E3%83%BC%E9%81%95%E5%8F%8D+OR+%E8%BF%B7%E6%83%91%E8%A1%8C%E7%82%BA+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 検索 裁き"
    url: "https://news.google.com/rss/search?q=%E5%86%A4%E7%BD%AA+OR+%E5%86%8D%E5%AF%A9+OR+%E8%87%AA%E7%99%BD+OR+%E5%8F%96%E3%82%8A%E8%AA%BF%E3%81%B9+OR+%E4%BA%BA%E8%B3%AA%E5%8F%B8%E6%B3%95+OR+%E5%8B%BE%E7%95%99+OR+%E7%A7%81%E5%88%91+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 検索 老い・終末期"
    url: "https://news.google.com/rss/search?q=%E7%B5%82%E6%B4%BB+OR+%E5%AE%89%E6%A5%BD%E6%AD%BB+OR+%E5%B0%8A%E5%8E%B3%E6%AD%BB+OR+%E5%BB%B6%E5%91%BD+OR+%E5%81%A5%E5%BA%B7%E5%AF%BF%E5%91%BD+OR+%E5%AD%A4%E7%8B%AC+OR+%E5%AD%A4%E7%AB%8B+OR+%E8%80%81%E5%BE%8C+when:2d&hl=ja&gl=JP&ceid=JP:ja"
  - name: "Google News 検索 教育"
    url: "https://news.google.com/rss/search?q=%E3%81%84%E3%81%98%E3%82%81+OR+%E5%85%A5%E8%A9%A6+OR+%E5%81%8F%E5%B7%AE%E5%80%A4+OR+%E4%B8%B8%E6%9A%97%E8%A8%98+OR+%E6%95%99%E8%82%B2%E6%94%B9%E9%9D%A9+OR+%E5%AD%A6%E5%8A%9B%E3%83%86%E3%82%B9%E3%83%88+OR+%E6%95%99%E5%93%A1%E6%8E%A1%E7%94%A8+when:2d&hl=ja&gl=JP&ceid=JP:ja"
