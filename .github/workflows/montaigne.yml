name: Update Montaigne Feed

# モンテーニュボット(社会面・科学医療の論評)。
# マキャベリボット(tweet.yml)とは別のワークフローで、触れるファイルも別:
#   docs/montaigne/feed.json, logs/montaigne_*.json
#
# 頻度調整はここ(cron)で行う。UTC基準なので日本時間との時差(+9時間)に注意。
# マキャベリ側(UTC 0,3,6,...,21時の17分)のそれぞれ1時間後に実行する(1日8回)。
# 日本時間では 1:17, 4:17, 7:17, 10:17, 13:17, 16:17, 19:17, 22:17。
# 【0分を避ける理由】GitHub の定時実行は毎時0分に全利用者の予約が集中し、
# 遅延や実行の取りこぼしが起きやすい(公式文書でも0分以外を推奨)。
# 【注意】定時実行は「cron の行を最後に変更したユーザー」の権限で起動する。
# cron の行を変更するコミットは、必ずこのリポジトリに書き込み権限のある texocorp 名義で行うこと。
# 2026年11月2日、作成者を Claude <noreply@anthropic.com>(GitHub 上の別アカウント claude に紐づく)
# にしたコミットで cron を変更・作成した結果、モンテーニュ・ベーコンの定時実行は一度も起動せず、
# マキャベリも以後止まった。エラーも通知も出ないので気づきにくい。
on:
  schedule:
    - cron: "17 1-22/3 * * *"
  workflow_dispatch: {}   # Actionsタブから手動実行も可能にする

permissions:
  contents: write

concurrency:
  group: update-montaigne-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # マキャベリボットと同じローカルLLM。変更する場合はこの1行だけを書き換える。
      OLLAMA_MODEL: "qwen3.5:9b"
      OLLAMA_HOST: "http://localhost:11434"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:11434/ && break
            sleep 1
          done

      - name: Pull local model
        run: |
          ollama --version
          ollama pull "$OLLAMA_MODEL"

      - name: Generate feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_montaigne_feed.py

      - name: Show Ollama log
        if: always()
        run: tail -n 40 ollama.log || true

      - name: Commit and push updated feed
        run: |
          git config user.name "montaigne-bot"
          git config user.email "actions@users.noreply.github.com"

          # フィードと、モンテーニュ側の状態ファイル(既出記事・箴言の使用履歴)だけをコミットする。
          # マキャベリ側のファイルには触れない。
          git add docs/montaigne/feed.json
          git add logs/montaigne_*.json 2>/dev/null || true

          if git diff --quiet --cached; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi

          git commit -m "Update montaigne feed.json [skip ci]"

          # マキャベリ側の実行と push が重なった場合に備え、最新を取り込んで再試行する(最大3回)。
          for i in 1 2 3; do
            if git push; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失敗。リモートの最新状態を取り込んで再試行します (試行 $i/3)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 3
          done

          echo "3回試行しても push に失敗しました。"
          exit 1
