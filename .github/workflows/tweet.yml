name: Update Machiavelli Feed

# 【起動の仕組み(2026-11-03 改訂)】
# GitHub の定時実行は、混雑すると遅れたり取りこぼされたりする(2026-11-03 には、3つのボットとも
# 11時半ごろから5時間以上、一度も起動しなかった)。そこで毎時17分に起動を試み、実際に生成するか
# どうかは guard ジョブ(schedule_guard.py)が決める。
#   ・受け持ちの時刻(UTC 0,3,6,…,21時)に、3時間おきに生成する。
#     日本時間では 0:17, 3:17, 6:17, 9:17, 12:17, 15:17, 18:17, 21:17。
#     モンテーニュボットはこの1時間後、ベーコンボットは2時間後を受け持つ。
#   ・受け持ちの時刻が取りこぼされたら、次の時刻に追いつき、その後は元の時刻に戻る
#   ・見送る回は guard ジョブだけが10秒ほど動き、update-feed ジョブは「スキップ」と表示される(失敗ではない)
#   ・手動実行(Actions タブの Run workflow)は、常に生成する
# 間隔などの規則は schedule_guard.py で調整でき、このファイルを書き換える必要はない。
#
# 【17分にする理由】GitHub の定時実行は毎時0分に全利用者の予約が集中し、
# 遅延や実行の取りこぼしが起きやすい(公式文書でも0分以外を推奨)。
#
# 【注意】定時実行は、このワークフローを最後に変更したユーザーの権限で起動する
# (「cron の行を最後に変えた人」とする説と「ファイルを最後に変えた人」とする説がある)。
# このファイルの変更は、行にかかわらず、必ずこのリポジトリに書き込み権限のある texocorp 名義で行うこと。
# 2026年11月2日、作成者を Claude <noreply@anthropic.com>(GitHub 上の別アカウント claude に紐づく)
# にしたコミットで cron を変更・作成した結果、モンテーニュ・ベーコンの定時実行は一度も起動せず、
# マキャベリも以後止まった。エラーも通知も出ないので気づきにくい。
on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分に起動を試みる(生成するかは guard ジョブが決める)
  workflow_dispatch: {}   # Actionsタブから手動実行も可能にする

permissions:
  contents: write
  actions: read   # guard ジョブが、このワークフローの実行履歴を読むため

# 同時に複数のワークフローが走って push が競合しないよう、直列実行に制御する。
# (手動実行と定時実行が重なった場合、後発は前者の完了を待ってから実行される)
concurrency:
  group: update-machiavelli-feed
  cancel-in-progress: false

jobs:
  # 実際に生成するかを決める(10秒ほどで終わる)。手動実行なら常に「生成する」。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to generate
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 schedule_guard.py machiavelli

  update-feed:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    # qwen3.5:9b(約6.6GB)のダウンロードとCPUでの生成を見込んだ上限。
    # 万一処理が固まっても、この時間で打ち切られる。
    timeout-minutes: 30
    env:
      # 使用するローカルLLM。変更する場合はこの1行だけを書き換える。
      OLLAMA_MODEL: "qwen3.5:9b"
      OLLAMA_HOST: "http://localhost:11434"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- 無料・独立のローカルLLM(Ollama)のセットアップ ---
      # Anthropic API等の外部有料サービスを使わず、CI実行環境内で
      # 完結する軽量モデルにより、つぶやきの下書きを推敲する。
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:11434/ && break
            sleep 1
          done

      - name: Pull local model
        run: |
          ollama --version
          ollama pull "$OLLAMA_MODEL"

      - name: Generate feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_feed.py

      # 生成に失敗した場合の原因調査用に、Ollama本体のログ末尾を表示する
      - name: Show Ollama log
        if: always()
        run: tail -n 40 ollama.log || true

      - name: Commit and push updated feed
        run: |
          git config user.name "machiavelli-bot"
          git config user.email "actions@users.noreply.github.com"

          # docs/feed.json に加え、logs/ 以下の状態ファイル
          # (重複ニュース履歴・箴言の使用履歴・使用回数)もまとめてコミット対象にする。
          # これらが永続化されないと、箴言の重複回避や偏り是正が
          # 実行のたびにリセットされてしまう。
          git add docs/feed.json
          if [ -d logs ]; then
            git add logs/
          fi

          if git diff --quiet --cached; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi

          git commit -m "Update feed.json [skip ci]"

          # push が「remote に新しい変更がある」ために拒否された場合に備え、
          # 直前の最新状態を取り込んでから再試行する(最大3回)。
          for i in 1 2 3; do
            if git push; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失敗。リモートの最新状態を取り込んで再試行します (試行 $i/3)"
            git pull --rebase origin main
            sleep 3
          done

          echo "3回試行しても push に失敗しました。"
          exit 1
